[[mods]]
modId="pb_hanhua_server"
version="1.0.0"
displayName="PB 蜂名服务端汉化 (绿油油版)"
description='''服务端专用语言注入：蜂笼捕获时服务端会把蜂名 getString() 解析后烙进物品 NBT，
专用服务器只有 en_us 语言表，资源蜂(configurable bee)的 entity.productivebees.*_bee 键
在上游 en_us 中不存在，导致烙进原始键名。本 mod 以 en_us 提供 461 个蜂名中文值，
使服务端解析结果直接为中文。客户端无需安装（装了也无害）。'''

[[dependencies.pb_hanhua_server]]
    modId="productivebees"
    type="required"
    # PB 版本串是 "1.21.1-13.13.5"，写 [13,) 会因 1.21.1 < 13 拒载而炸服，不限版本
    versionRange="[0,)"
    # AFTER = 本 mod 排在 productivebees 之后加载，语言表合并时后者覆盖前者，
    # 否则上游 en_us 自带的英文蜂名（如 "Cyanite Bee"）会压过我们的中文值
    ordering="AFTER"
    side="BOTH"
