name: Release

# 构建分发包并发布 GitHub Release。
# 仓库里没有任何一棵出货目录树：assemble.py 从 src/ 现摊、生成器现产、
# gen_upstream_patches.py 对着**各版本官方文件**现打补丁，再由 build_dist.sh 压包。
#
# 触发方式：
#   1. push tag v* —— 自动按 tag 名解析版本号、自动发布 release；
#   2. workflow_dispatch —— Actions 页面手动触发，可选发布。
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub release after building
        type: boolean
        required: true
        default: false
      version:
        description: 补丁版本号，如 r12（与整合包版本无关；产物名里的 atm7.x 才是整合包版本）
        type: string
        required: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build distribution zip
    runs-on: ubuntu-latest
    # 与 build.yml 同一套钉死的工具链——发布产物必须能和 CI 产物逐字节对上。
    container:
      image: python@sha256:d50fb7611f86d04a3b0471b46d7557818d88983fc3136726336b2a4c657aa30b
    env:
      ATM_TOOLCHAIN_DIGEST: sha256:d50fb7611f86d04a3b0471b46d7557818d88983fc3136726336b2a4c657aa30b
    steps:
      - uses: actions/checkout@v6

      # 校验挪进 build_dist.sh 了：check.py 查的是**出货树**，而出货树是构建时才有的，
      # 而且每个整合包版本各查一遍（上游文件按版本不同）。

      # 三条路径：
      #   tag push (vr13 / v7.2-release11) ──> publish=true
      #   manual + publish=true + version ──> publish=true
      #   manual + publish=false ──> 只构建不发布
      - name: Resolve release options
        id: release
        shell: bash
        env:
          PUBLISH_RELEASE: ${{ inputs.publish_release || false }}
          RELEASE_INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            # 补丁版本号已与整合包版本解耦（产物名是 -<补丁版本>-atm<整合包版本>.zip），
            # 所以 tag 认两种：
            #   新：vR12 / vr12 / v12 / v12.1 / vR12-beta2
            #   旧：v7.2-release11 / v7.2-beta6（历史 tag，继续认，别把老流程弄挂）
            # r 大小写都认：CHANGELOG 的段名写作 `## R12`，人自然会跟着写大写。
            if [[ ! "$tag" =~ ^[vV][rR]?[0-9]+(\.[0-9]+)*(-(release|beta|rc)[0-9]+)?$ ]]; then
              echo "❌ Tag '$tag' 不是认得的形态。写 vR12 / vR12-beta1，旧式 v7.2-release11 也行。" >&2
              exit 1
            fi
            version="${tag#v}"
            beta=false
            [[ "$version" =~ -(beta|rc)[0-9]+$ ]] && beta=true
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "beta=$beta" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          publish_release="$PUBLISH_RELEASE"
          version="$RELEASE_INPUT_VERSION"

          if [[ "$publish_release" != "true" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "version=${version:-0.0.0-ci}" >> "$GITHUB_OUTPUT"
            echo "beta=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$version" ]]; then
            echo "A version is required when publishing a release." >&2
            exit 1
          fi
          # 与上面 tag 那条**同一个形态**（少个前导 v），别两边各写一套然后对不上：
          # 新 R12 / r12 / 12 / 12.1 / R12-beta2；旧 7.2-release11 / 7.2-beta6
          if [[ ! "$version" =~ ^[rR]?[0-9]+(\.[0-9]+)*(-(release|beta|rc)[0-9]+)?$ ]]; then
            echo "❌ 版本号 '$version' 不是认得的形态。写 R12 / R12-beta1，旧式 7.2-release11 也行。" >&2
            exit 1
          fi
          beta=false
          [[ "$version" =~ -(beta|rc)[0-9]+$ ]] && beta=true
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "beta=$beta" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 装 Pillow
        run: python -m pip install --quiet Pillow

      - name: 取字体（全部 OFL）
        run: ./scripts/fetch_fonts.sh


      # ATM10 的某个已发布版本，overrides 内容是不会变的，所以缓存键就用仓库里记的
      # 那三个指纹——只有我们**有意**改了目标版本时才会失效。
      # 这一步是为了把 CurseForge（全链唯一不可控的外部依赖）从最高频的那道闸上挪开：
      # 命中缓存就完全不联网；未命中才下，且下完必须与 versions/<版本>/overrides.sha256
      # 对得上，否则构建当场红。
      - uses: actions/cache@v4
        with:
          path: build/packsrc
          key: packsrc-${{ hashFiles('versions/*/overrides.sha256') }}

      - name: 下整合包（overrides + 全部 mod jar）
        run: |
          set -euo pipefail
          # 生成器要读 mod jar 里的 en_us 与注册表，取最新那版一次即可
          # （资源包 lang 按命名空间索引，跨版本通用）。
          NEWEST=$(ls -d versions/[0-9]* | xargs -n1 basename | sort -V | tail -1)
          python3 scripts/fetch_pack.py "$NEWEST" pack
          echo "ATM_PACK_ROOT=$PWD/pack" >> "$GITHUB_ENV"
          # 每个目标版本再取一份 overrides（只要官方文件，不下 jar）——
          # 打上游补丁必须对着**该版**的官方文件，否则等于把旧上游发给新版本用户。
          for v in $(ls -d versions/[0-9]* | xargs -n1 basename); do
            [ -d "build/packsrc/$v/kubejs" ] || python3 scripts/fetch_pack.py "$v" "build/packsrc/$v" --no-jars
          done

      - name: 生成全部汉化产物
        run: ./scripts/generate_all.sh

      - name: 打包全部整合包版本
        # 不给第二个参数 = 出 versions/ 下声明过的全部版本。
        # 通配只在仓库声明过的版本里展开，ATM 发新版不会自动混进来。
        run: ./scripts/build_dist.sh "${{ steps.release.outputs.version }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          IS_BETA: ${{ steps.release.outputs.beta }}
        run: |
          set -euo pipefail

          # 取 CHANGELOG 里对应的段落。标题**按整串精确比对**，不走正则——
          # 历史上段名带过 `.` 和 `*`（`## 7.*`），当正则用会顺手匹配上 `## 7.2`，
          # 发出去的说明就是别的版本的。
          # 大小写不敏感：tag 写 `vr12`，CHANGELOG 里的段名是 `## R12`。
          extract() {
            awk -v ver="## $1" '
              tolower($0) == tolower(ver) { found=1; next }
              found && /^## / { exit }
              found { buf = buf $0 "\n" }
              END { sub(/^\n+/, "", buf); sub(/\n+$/, "", buf); print buf }
            ' CHANGELOG.md
          }
          # 顺序：精确补丁版本 → 文件里第一个 ## 段（当前在写的那一段）。
          # **不要**再回落到「去掉通道后缀的基版本」：`## 7.2` 现在是冻结的历史段
          # （431 行），推 v7.2-release12 这种旧式 tag 会把那一整段当成新版说明发出去。
          FROM="## $RELEASE_VERSION"
          NOTES=$(extract "$RELEASE_VERSION")
          if [ -z "$NOTES" ]; then
            FIRST=$(awk '/^## /{sub(/^## /,""); print; exit}' CHANGELOG.md)
            FROM="## $FIRST（回落）"
            NOTES=$(extract "$FIRST")
          fi
          if [ -z "$NOTES" ]; then
            echo "❌ CHANGELOG.md 里一个 ## 段都取不到，发版说明会是空的——先写 CHANGELOG" >&2
            exit 1
          fi
          echo "发版说明取自 CHANGELOG 的 $FROM"

          PRERELEASE_FLAG=""
          [[ "$IS_BETA" == "true" ]] && PRERELEASE_FLAG="--prerelease"

          # 一次发版挂上全部整合包版本的包：
          #   atm10-zh_cn-{client,server}-<补丁版本>-atm<整合包版本>.zip
          # build_dist.sh 直接产出 ASCII 名（连解压出来的文件夹名也是 ASCII）——
          # 中文文件夹名在 Windows 各解压软件下编码不一致，用户拿到手就是乱码。
          # 每个声明过的整合包版本都必须有客户端 + 服务端两个包，缺一个就别发。
          # 按清单逐个点名，不是 `ls` 出多少算多少——少打了一个版本必须当场发现。
          # （不用 mapfile：那是 bash 4+ 的内建，本机 bash 3.2 跑不了，
          #   本地就验不了这段门控。）
          ZIPS=()
          for v in $(ls -d versions/[0-9]* | xargs -n1 basename); do
            for side in client server; do
              f="dist/atm10-zh_cn-${side}-${RELEASE_VERSION}-atm${v}.zip"
              [ -f "$f" ] || { echo "❌ 缺少 $f"; exit 1; }
              ZIPS+=("$f")
            done
          done
          [ "${#ZIPS[@]}" -ge 2 ] || { echo "❌ versions/ 下一个版本都没有"; exit 1; }
          printf '  挂载: %s\n' "${ZIPS[@]}"

          gh release delete "v$RELEASE_VERSION" --yes 2>/dev/null || true

          gh release create "v$RELEASE_VERSION" \
            "${ZIPS[@]}" \
            --title "绿油油版汉化 v$RELEASE_VERSION" \
            --notes "$NOTES" \
            --draft=false \
            $PRERELEASE_FLAG
